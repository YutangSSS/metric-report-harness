[project]
name = "metric-report-harness"
version = "0.1.0"
description = "Spec -> Runner -> Verifier -> Report: recurring government-style reporting requests, rebuilt on public shelter data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
