name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Cache public dataset
        uses: actions/cache@v4
        with:
          path: data/*.csv
          key: aac-4621420f23e9008de4581d971b1a9626d2ccd506
      - name: Fetch dataset (pinned revision, SHA-256 checked)
        run: uv run python scripts/fetch_data.py
      - name: Install all groups
        run: uv sync --all-groups
      - name: Tests (rules, 10 examples, independent recount, fingerprint, agent offline, API)
        run: uv run pytest -q
      - name: Run all 10 reports through the gate
        run: uv run harness run-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: out/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t metric-report-harness .
      - name: Smoke test the API in the container
        run: |
          docker run -d --name api -p 8000:8000 metric-report-harness
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          curl -sf -X POST localhost:8000/reports/01 -H 'content-type: application/json' \
            -d '{"params": {"quarter": "2017-18 Q2"}}' | grep -q '"passed":true'
          docker logs api | tail -20
